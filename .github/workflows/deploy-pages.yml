name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm run test:deployment-tags
          npm test -- --watch=false

      - name: Build Angular application
        env:
          BASE_HREF: ${{ steps.pages.outputs.base_path }}/
        run: npm run build -- --configuration production --base-href "$BASE_HREF"

      - name: Inject production Google tags
        if: github.repository == 'alexbgh1/dbml-converter'
        env:
          GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          DEPLOYMENT_ORIGIN: ${{ steps.pages.outputs.origin }}
          DEPLOYMENT_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run inject-deployment-tags

      - name: Add Angular route entry points and fallback
        run: |
          artifact_dir="dist/dbml-converter/browser"
          for route in split-view files-view diagram preview-mode editor-mode; do
            mkdir -p "$artifact_dir/$route"
            cp "$artifact_dir/index.html" "$artifact_dir/$route/index.html"
          done
          cp "$artifact_dir/index.html" "$artifact_dir/404.html"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/dbml-converter/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
